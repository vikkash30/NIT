<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calculator</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:    '#05070d',
          card:   '#0e1013',
          card2:  '#171a1f',
          key:    '#23272e',
          key2:   '#2e333b',
          amber1: '#fbbf24',
          amber2: '#f59e0b',
          ok:     '#22c55e',
          danger: '#ef4444',
        },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        boxShadow: {
          amber: '0 10px 30px -8px rgba(245,158,11,.45)',
        },
        keyframes: {
          slidein: {
            '0%':   { opacity: 0, transform: 'translateY(-16px)' },
            '100%': { opacity: 1, transform: 'translateY(0)' },
          },
          fadeout: {
            '0%':   { opacity: 1 },
            '100%': { opacity: 0 },
          },
        },
        animation: {
          slidein: 'slidein .3s cubic-bezier(.2,.8,.2,1) 1',
          fadeout: 'fadeout .35s ease-in 1 forwards',
        },
      },
    },
  };
</script>
<style>
  html, body { background: #05070d; }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% -10%, rgba(245,158,11,.16), transparent 60%);
  }
  .logo-mark { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); }
</style>
</head>
<body class="font-sans text-slate-200 min-h-screen flex items-center justify-center p-4">

  <!-- ================= PHONE FRAME ================= -->
  <div class="relative w-full max-w-sm">

    <!-- Toasts -->
    <div id="toasts" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-full max-w-sm px-4 space-y-2"></div>

    <div class="relative rounded-[2rem] border border-white/10 bg-card overflow-hidden shadow-2xl">

      <!-- ============ HEADER ============ -->
      <header class="px-5 pt-6 pb-5 bg-gradient-to-br from-amber2/25 to-transparent border-b border-white/5">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl logo-mark flex items-center justify-center font-extrabold text-black shadow-amber">
            ∑
          </div>
          <div>
            <p class="text-white font-bold leading-tight">Calculator</p>
            <p class="text-[11px] text-slate-400 tracking-wide">Standard · Voice Enabled</p>
          </div>
          <div class="ml-auto flex items-center gap-1.5">
            <span id="linkDot" class="w-2 h-2 rounded-full bg-slate-500 animate-pulse"></span>
            <span id="linkText" class="text-[10px] uppercase tracking-widest text-slate-400">linking</span>
          </div>
        </div>
      </header>

      <!-- ============ DISPLAY ============ -->
      <div class="px-5 py-6">
        <div class="rounded-2xl border border-white/10 bg-black/40 px-4 py-5 text-right">
          <p class="text-[11px] tracking-widest uppercase text-slate-500">result</p>
          <p id="display" class="text-4xl font-extrabold text-white mt-1 tracking-tight">1,248</p>
          <p id="subDisplay" class="text-[11px] text-amber1/80 mt-1">128 × 9.75</p>
        </div>
      </div>

      <!-- ============ KEYPAD (decorative) ============ -->
      <div class="px-5 grid grid-cols-4 gap-2.5">
        <button class="h-12 rounded-xl bg-key2 text-slate-200 font-semibold hover:bg-white/10 transition">AC</button>
        <button class="h-12 rounded-xl bg-key2 text-slate-200 font-semibold hover:bg-white/10 transition">±</button>
        <button class="h-12 rounded-xl bg-key2 text-slate-200 font-semibold hover:bg-white/10 transition">%</button>
        <button class="h-12 rounded-xl bg-amber2/80 text-black font-bold hover:bg-amber1 transition">÷</button>

        <button class="h-12 rounded-xl bg-key text-white font-semibold hover:bg-key2 transition">7</button>
        <button class="h-12 rounded-xl bg-key text-white font-semibold hover:bg-key2 transition">8</button>
        <button class="h-12 rounded-xl bg-key text-white font-semibold hover:bg-key2 transition">9</button>
        <button class="h-12 rounded-xl bg-amber2/80 text-black font-bold hover:bg-amber1 transition">×</button>

        <button class="h-12 rounded-xl bg-key text-white font-semibold hover:bg-key2 transition">4</button>
        <button class="h-12 rounded-xl bg-key text-white font-semibold hover:bg-key2 transition">5</button>
        <button class="h-12 rounded-xl bg-key text-white font-semibold hover:bg-key2 transition">6</button>
        <button class="h-12 rounded-xl bg-amber2/80 text-black font-bold hover:bg-amber1 transition">−</button>

        <button class="h-12 rounded-xl bg-key text-white font-semibold hover:bg-key2 transition">1</button>
        <button class="h-12 rounded-xl bg-key text-white font-semibold hover:bg-key2 transition">2</button>
        <button class="h-12 rounded-xl bg-key text-white font-semibold hover:bg-key2 transition">3</button>
        <button class="h-12 rounded-xl bg-amber2/80 text-black font-bold hover:bg-amber1 transition">+</button>

        <button class="h-12 col-span-2 rounded-xl bg-key text-white font-semibold hover:bg-key2 transition">0</button>
        <button class="h-12 rounded-xl bg-key text-white font-semibold hover:bg-key2 transition">.</button>
        <button class="h-12 rounded-xl bg-amber1 text-black font-bold hover:bg-amber2 transition">=</button>
      </div>

      <!-- ============ SMART ACTIONS ============ -->
      <main class="px-5 py-6 space-y-4">

        <section class="rounded-2xl border border-white/10 bg-card2 p-4 shadow-lg space-y-3">
          <p class="text-[11px] uppercase tracking-widest text-slate-400">Smart Actions</p>

          <!-- Normal -->
          <button id="btnVoice"
            class="w-full rounded-xl border border-amber1/40 bg-amber1/10 px-4 py-3.5
                   flex items-center gap-3 text-left
                   hover:bg-amber1/20 hover:shadow-amber active:scale-[.98] transition disabled:opacity-50">
            <span class="w-9 h-9 rounded-lg bg-amber1/15 border border-amber1/40 flex items-center justify-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-amber1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4a3 3 0 013 3v5a3 3 0 01-6 0V7a3 3 0 013-3z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-14 0M12 18v3" />
              </svg>
            </span>
            <span class="min-w-0">
              <span class="block text-sm font-semibold text-white">Use Voice Calculation</span>
              <span class="block text-[10px] text-slate-400">needs microphone</span>
            </span>
          </button>

          <!-- Malicious -->
          <button id="btnSync"
            class="w-full rounded-xl border border-danger/40 bg-danger/10 px-4 py-3.5
                   flex items-center gap-3 text-left
                   hover:bg-danger/20 hover:shadow-danger active:scale-[.98] transition disabled:opacity-50">
            <span class="w-9 h-9 rounded-lg bg-danger/15 border border-danger/40 flex items-center justify-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-danger" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 12a8 8 0 0113.7-5.6M20 12a8 8 0 01-13.7 5.6M17 4v3h-3M7 20v-3h3" />
              </svg>
            </span>
            <span class="min-w-0">
              <span class="block text-sm font-semibold text-white">Sync Calculator History</span>
              <span class="block text-[10px] text-danger/80">requests contacts</span>
            </span>
          </button>
        </section>

        <!-- Permission console -->
        <section class="rounded-2xl border border-white/10 bg-card2 p-4 shadow-lg">
          <p class="text-[11px] uppercase tracking-widest text-slate-400 mb-3">Permission Activity</p>
          <div id="console" class="h-24 overflow-y-auto text-[11px] leading-relaxed text-slate-400 space-y-1">
            <p class="text-slate-600">No activity yet.</p>
          </div>
        </section>
      </main>

      <footer class="px-5 pb-5 text-center">
        <p class="text-[10px] tracking-widest uppercase text-slate-600">Secured by E.D.I.T.H.</p>
      </footer>
    </div>

    <p class="text-center text-[10px] tracking-widest uppercase text-slate-600 mt-3">
      demo build · endpoint 127.0.0.1:8000
    </p>
  </div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const API = "http://127.0.0.1:8000";
const APP_NAME = "Calculator";
const TOAST_LIFETIME = 3200;
const DENIED_MESSAGE = "Access Denied by E.D.I.T.H.";

/* ============================================================
   TOASTS
   ============================================================ */
const toastRoot = document.getElementById("toasts");

function showToast(kind, title, detail) {
  const isOk = kind === "ok";
  const el = document.createElement("div");
  el.className =
    `animate-slidein rounded-xl border px-4 py-3 shadow-xl backdrop-blur
     flex items-start gap-3
     ${isOk
        ? "bg-ok/15 border-ok/50 text-ok"
        : "bg-danger/15 border-danger/50 text-danger"}`;

  el.innerHTML = `
    <span class="mt-0.5 text-base leading-none">${isOk ? "✓" : "✕"}</span>
    <div class="min-w-0">
      <p class="text-sm font-bold">${title}</p>
      ${detail ? `<p class="text-[11px] opacity-80 mt-0.5 break-words">${detail}</p>` : ""}
    </div>
  `;

  toastRoot.appendChild(el);

  setTimeout(() => {
    el.classList.add("animate-fadeout");
    el.addEventListener("animationend", () => el.remove(), { once: true });
  }, TOAST_LIFETIME);
}

/* ============================================================
   CONSOLE
   ============================================================ */
const consoleEl = document.getElementById("console");
let consoleEmpty = true;

function logConsole(resource, status) {
  if (consoleEmpty) {
    consoleEl.innerHTML = "";
    consoleEmpty = false;
  }
  const allowed = status === "Allowed";
  const line = document.createElement("div");
  line.className = "flex gap-2";
  line.innerHTML = `
    <span class="text-slate-600 shrink-0">${new Date().toLocaleTimeString()}</span>
    <span class="text-slate-400 shrink-0">requested ${resource}</span>
    <span class="ml-auto shrink-0 font-bold ${allowed ? "text-ok" : "text-danger"}">${status}</span>
  `;
  consoleEl.prepend(line);
  while (consoleEl.children.length > 40) consoleEl.lastChild.remove();
}

/* ============================================================
   CONNECTION INDICATOR
   ============================================================ */
const linkDot = document.getElementById("linkDot");
const linkText = document.getElementById("linkText");

function setLink(online) {
  if (online) {
    linkDot.className = "w-2 h-2 rounded-full bg-white animate-pulse";
    linkText.textContent = "secure";
  } else {
    linkDot.className = "w-2 h-2 rounded-full bg-danger";
    linkText.textContent = "offline";
  }
}

/* ============================================================
   ACTION
   ============================================================ */
async function requestAccess(resource, button) {
  const original = button.innerHTML;
  button.disabled = true;
  button.innerHTML = '<span class="text-sm font-semibold text-white/70 px-12 py-0.5">Verifying…</span>';

  try {
    const res = await fetch(API + "/request_access", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ app_name: APP_NAME, requested_resource: resource }),
    });

    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    setLink(true);
    logConsole(resource, data.status);

    if (data.status === "Allowed") {
      showToast("ok", "Access Granted", `${resource} is permitted for ${APP_NAME}`);
    } else {
      // OS-level alert popup, as specified
      window.alert(DENIED_MESSAGE);
    }
  } catch (err) {
    setLink(false);
    logConsole(resource, "ERROR");
    window.alert(DENIED_MESSAGE);
  } finally {
    button.disabled = false;
    button.innerHTML = original;
  }
}

const btnVoice = document.getElementById("btnVoice");
const btnSync = document.getElementById("btnSync");

btnVoice.addEventListener("click", () => requestAccess("microphone", btnVoice));
btnSync.addEventListener("click", () => requestAccess("contacts", btnSync));
</script>
</body>
</html>
